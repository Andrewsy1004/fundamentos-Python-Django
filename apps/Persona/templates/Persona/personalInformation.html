<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal information {{person.name}}</title>
</head>
<body>
    
    <h1>Informacion de la persona</h1>
    <h2> Bienvenido: {{person.name}} !!  </h2>

    <h3> nombre : {{person.name}} </h3>
    <h3> apellido : {{person.last_name}} </h3>
    <h3> edad : {{person.age}} </h3>

    {% comment %} <ul>
        <li> Hola soy: {{ person.name }}, mi apellido es: {{ person.last_name }} y tengo {{ person.age }} años </li>
    </ul> {% endcomment %}

</body>
</html>
